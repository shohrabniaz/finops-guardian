apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-guardian
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-guardian
  template:
    metadata:
      labels:
        app: finops-guardian
    spec:
      containers:
        - name: api
          image: finops-guardian:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: finops-guardian
  namespace: demo
spec:
  selector:
    app: finops-guardian
  ports:
    - port: 8080
      targetPort: 8080
